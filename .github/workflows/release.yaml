name: Release

run-name: Release - ${{ format('{0}',github.event.repository.updated_at) }}

on:
  push:
    branches:
      - "v*"
      - "release/v*"
  workflow_dispatch:

jobs:
  release:
    name: Release
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_sha_short: ${{ steps.semantic.outputs.new_release_git_sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Guard
        id: guard
        run: |
          ./hack/release-guard.sh "${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Helm Docs
        if: steps.guard.outputs.skip == 'false'
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: v1.14.2

      - name: Setup Semantic Release Config for App
        if: steps.guard.outputs.skip == 'false'
        run: cp .github/releaserc/app.releaserc.yml .releaserc.yml

      - name: Semantic Release (App)
        if: steps.guard.outputs.skip == 'false'
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
            conventional-changelog-conventionalcommits
          dry_run: ${{ github.ref_name == 'main' }}

      - name: Sync Major Version Branch (vM)
        if: github.ref == 'refs/heads/main' && steps.semantic.outputs.new_release_published == 'true'
        run: |
          # Extract Major version (e.g., from 1.2.3 to v1)
          export MAJOR_VERSION="v${{ steps.semantic.outputs.new_release_major_version }}"
          echo "Target Major Branch: $MAJOR_VERSION"

          # Force create/reset the vM branch to the current commit (main)
          git checkout -B "$MAJOR_VERSION"
          git push origin "$MAJOR_VERSION" --force

  publish-image:
    name: Release Image
    runs-on: ubuntu-latest
    needs: release
    if: |
      (needs.release.outputs.new_release_published == 'true') &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v'))
    steps:
      - name: Docker Metadata
        if: needs.release.outputs.new_release_published == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}

      - name: Set up QEMU
        if: needs.release.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: needs.release.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: needs.release.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaging App
        if: needs.release.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
            COMMIT_HASH=${{ needs.release.outputs.new_release_git_sha_short }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
