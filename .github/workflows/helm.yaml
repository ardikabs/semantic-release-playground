name: Helm Chart

on:
  push:
    branches:
      - main
      - "release/v*"
    paths:
      - charts/**

  pull_request:
    branches:
      - main
      - "release/v*"
    paths:
      - charts/**

jobs:
  chart-test:
    name: Helm Chart Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install Helm Docs
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: v1.14.2

      - name: Setup Chart Linting
        id: lint
        uses: helm/chart-testing-action@v2.8.0
        with:
          # Note: Also update in scripts/lint.sh
          version: 3.14.0

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct-lint.yaml --lint-conf ./.github/configs/lintconf.yaml

      - name: Run docs-testing (helm-docs)
        id: helm-docs
        run: |
          helm-docs -t hack/CHART_README.md.gotmpl -c charts
          if [[ $(git diff --stat) != '' ]]; then
            echo -e '\033[0;31mDocumentation outdated!\033[0m ❌'
            git diff --color
          else
            echo -e '\033[0;32mDocumentation up to date\033[0m ✔'
          fi

      - name: Run helm-unittest
        id: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.3 --verify=false
          helm unittest charts/dummy

  chart-release:
    name: Release Helm Chart
    needs: [chart-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # IMPORTANT: Pull latest changes to get the commit from release-app if it ran
      - name: Pull latest changes
        run: git pull origin ${GITHUB_REF#refs/heads/} || true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install Helm Docs
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: v1.14.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Semantic Release Config for App
        run: cp .github/releaserc/chart.releaserc.yml .releaserc.yml

      - name: Fetch Latest Tags
        run: |
          git fetch --tags

      - name: Semantic Release (Chart)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
            conventional-changelog-conventionalcommits

      - name: Login to GitHub Container Registry (Helm OCI)
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git fetch --tags
          helm package charts/dummy --version ${{ steps.semantic.outputs.new_release_version }} --app-version $(git describe --tags --abbrev=0 --match "v*")
          helm push dummy-${{ steps.semantic.outputs.new_release_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Chart Release
        uses: softprops/action-gh-release@v2
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Helm Chart v${{ steps.semantic.outputs.new_release_version }}"
          tag_name: "chart-v${{ steps.semantic.outputs.new_release_version }}"
          body: |
            ${{ steps.semantic.outputs.new_release_notes }}

            ## 📦 Get the Chart
            The Dummy chart is now available as an OCI artifact via GHCR. Install it with a single command:

            ```bash
            helm install dummy oci://ghcr.io/${{ github.repository_owner }}/charts/dummy --version ${{ steps.semantic.outputs.new_release_version }}
            ```

          generate_release_notes: true
          prerelease: false
          draft: false
          make_latest: "false"