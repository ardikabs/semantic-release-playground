branches:
- "release/v+([0-9]).+([0-9])"

tagFormat: "chart-v${version}"

plugins:
- [
    "@semantic-release/commit-analyzer",
    {
      "preset": "conventionalcommits",
      "releaseRules": [
        {"scope": "charts", "type": "feat", "release": "minor"},
        {"scope": "charts", "type": "fix", "release": "patch"},
        {"scope": "!charts", "release": false},
      ]
    }
  ]
- [
    "@semantic-release/exec",
    {
      "prepareCmd": "./hack/sync-version.sh ${nextRelease.version} app"
    }
  ]
- [
    "@semantic-release/git",
    {
      "assets": ["charts/dummy/Chart.yaml", "charts/dummy/README.md"],
      "message": "chore(charts): ${nextRelease.version} [skip ci]\n${nextRelease.notes}"
    }
  ]
- "@semantic-release/github"
