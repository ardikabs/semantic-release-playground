branches:
- "main"

tagFormat: "chart-v${version}"

plugins:
- [
    "@semantic-release/commit-analyzer",
    {
      "preset": "conventionalcommits",
      "releaseRules": [
        {"scope": "!charts", "release": false},
        {"scope": "charts", "type": "feat", "release": "minor"},
        {"scope": "charts", "type": "fix", "release": "patch"}
      ]
    }
  ]
- [
    "@semantic-release/release-notes-generator",
    {
      "preset": "conventionalcommits",
      "presetConfig": {
        "types": [
          {"scope": "!charts", "hidden": true},
          { "type": "feat", "section": "✨ Features", "hidden": false },
          { "type": "fix", "section": "🐛 Bug Fixes", "hidden": false },
          { "type": "chore", "section": "🧹 Miscellaneous", "hidden": false }
        ]
      }
    }
  ]
- [
    "@semantic-release/exec",
    {
      "prepareCmd": "./hack/sync-version.sh ${nextRelease.version} chart"
    }
  ]
- [
    "@semantic-release/git",
    {
      "assets": [
        "charts/dummy/Chart.yaml",
        "charts/dummy/README.md"
      ],
      "message": "chore(charts): ${nextRelease.version} [skip ci]\n${nextRelease.notes}"
    }
  ]
- "@semantic-release/github"
