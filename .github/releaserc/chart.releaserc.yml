branches:
- "main"
- {
    "name": "release/v+([0-9]).+([0-9])",
    "range": "1.x",
    "channel": "1.x"
  }


tagFormat: "chart-v${version}"

plugins:
- [
    "@semantic-release/commit-analyzer",
    {
      "preset": "conventionalcommits",
      "releaseRules": [
        {"scope": "charts", "type": "feat", "release": "minor"},
        {"scope": "charts", "type": "fix", "release": "patch"},
        {"scope": "!charts", "release": false},
      ]
    }
  ]
- [
    "@semantic-release/exec",
    {
      "prepareCmd": "./hack/sync-version.sh ${nextRelease.version} chart"
    }
  ]
- [
    "@semantic-release/git",
    {
      "assets": [
        "charts/dummy/Chart.yaml",
        "charts/dummy/README.md"
      ],
      "message": "chore(charts): ${nextRelease.version} [skip ci]\n${nextRelease.notes}"
    }
  ]
- "@semantic-release/github"
