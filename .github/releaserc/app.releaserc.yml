branches:
- "release/v+([0-9]).+([0-9])"

tagFormat: "v${version}"

plugins:
- [
    "@semantic-release/commit-analyzer",
    {
      "preset": "conventionalcommits",
      "releaseRules": [
        {"scope": "charts", "release": false},
        {"type": "feat", "release": "minor"},
        {"type": "fix", "release": "patch"},
        {"type": "perf", "release": "patch"}
      ]
    }
  ]
- "@semantic-release/release-notes-generator"
- "@semantic-release/changelog"
- [
    "@semantic-release/exec",
    {
      "prepareCmd": "./hack/sync-version.sh ${nextRelease.version} app"
    }
  ]
- [
    "@semantic-release/git",
    {
      "assets": ["charts/dummy/Chart.yaml", "charts/dummy/README.md"],
      "message": "chore(charts): update appVersion to ${nextRelease.version} [skip ci]"
    }
  ]
- "@semantic-release/github"
