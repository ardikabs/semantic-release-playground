branches:
- name: "${GITHUB_REF_NAME}"
- name: "release/v+([0-9]).+([0-9])"
  range: "${name.replace('release/v', '') + '.x'}"
  channel: "${name.replace('release/v', '')}"

# Default tagFormat is "v${version}". Note for reference https://semantic-release.gitbook.io/semantic-release/usage/configuration#tagformat
# Do not make a change here cause this releaserc configuration is used to parse with envsubst
# explicitly specify tagFormat with `v${version}` will omit the `${version}`.
# Until the https://github.com/semantic-release/semantic-release/issues/1487 is resolved, we workaround this by templating with envsubst.
# tagFormat: "v${version}"

plugins:
- [
    "@semantic-release/commit-analyzer",
    {
      "preset": "conventionalcommits",
      "releaseRules": [
        {"scope": "charts", "release": false},
        {"type": "feat", "release": "minor"},
        {"type": "fix", "release": "patch"},
        {"type": "perf", "release": "patch"}
      ]
    }
  ]
- [
    "@semantic-release/release-notes-generator",
    {
      "preset": "conventionalcommits",
      "presetConfig": {
        "types": [
          { "type": "feat", "section": "✨ Features", "hidden": false },
          { "type": "fix", "section": "🐛 Bug Fixes", "hidden": false },
          { "type": "perf", "section": "⚡ Performance Improvements", "hidden": false },
          { "type": "chore", "section": "🧹 Miscellaneous", "hidden": false }
        ]
      }
    }
  ]
- [
    "@semantic-release/exec",
    {
      "prepareCmd": "echo ${nextRelease.version} > VERSION",
      "generateNotesCmd": "./hack/sync-version.sh ${nextRelease.version} app",
      "publishCmd": "./hack/auto-release-branch.sh ${nextRelease.version} ${nextRelease.gitTag}"
    }
  ]
- [
    "@semantic-release/git",
    {
      "assets": [
        "charts/dummy/Chart.yaml",
        "charts/dummy/README.gotmpl"
      ],
      "message": "chore(release): ${nextRelease.version} [skip ci]\n${nextRelease.notes}"
    }
  ]
- "@semantic-release/github"
